[project]
name = "audit-engine"
version = "0.1.0"
description = "Tests a customer-facing AI agent against facts and rules taken from a company's own policies."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx2>=2.16.0",
    "openai>=3.41.0",
    "pydantic>=2.14.2",
    "pyyaml>=6.0.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
