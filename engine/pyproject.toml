[project]
name = "audit-engine"
version = "0.1.0"
description = "Tests a customer-facing AI agent against facts and rules taken from a company's own policies."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx2>=2.16.0",
    "jinja2>=3.1.6",
    "openai>=3.41.0",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.2",
    "pyyaml>=6.0.3",
    "typer>=0.27.3",
]

[project.scripts]
audit-engine = "audit_engine.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
