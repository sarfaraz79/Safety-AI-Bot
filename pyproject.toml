# Workspace root. Each package lives in its own folder with its own pyproject.toml;
# shared tool settings (lint, types, tests) live here.

[tool.uv.workspace]
members = ["demo-bot"]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["demo-bot/src", "demo-bot/tests"]  # lets import sorting recognise our own packages

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # import sorting
    "N",        # naming
    "UP",       # modern syntax
    "B",        # likely bugs
    "S",        # security (bandit)
    "ASYNC",    # async pitfalls
    "BLE",      # blind except
    "A",        # shadowing builtins
    "C4",       # comprehensions
    "PIE",
    "T20",      # no print()
    "PT",       # pytest style
    "RET",      # return statements
    "SIM",      # simplifications
    "TID",      # tidy imports
    "ARG",      # unused arguments
    "PTH",      # pathlib
    "ERA",      # commented-out code
    "PL",       # pylint
    "RUF",
]
ignore = [
    "SIM905",   # a split string reads better than a long list literal for word lists
]

[tool.ruff.lint.per-file-ignores]
"*/tests/*" = [
    "S101",     # assert is how pytest checks things
    "S104",     # tests use 0.0.0.0 as data, not to bind
    "S105",     # hard-coded test tokens are fine
    "S106",
    "PLR2004",  # literal values in assertions
]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]
files = ["demo-bot/src", "demo-bot/tests"]
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest]
testpaths = ["demo-bot/tests"]
addopts = ["--import-mode=importlib", "--strict-markers", "--strict-config", "-ra"]
xfail_strict = true
filterwarnings = ["error"]

[tool.coverage.run]
branch = true
source = ["demo-bot/src"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 95
exclude_also = [
    'if __name__ == "__main__":',
    'case _:\n\s*assert_never\(',  # exhaustiveness checks that can never run
]
